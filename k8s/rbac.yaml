apiVersion: v1
kind: ServiceAccount
metadata:
  name: tax-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tax-deployer
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: ['']
    resources: [services]
    verbs: [get, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tax-deployer
subjects:
  - kind: ServiceAccount
    name: tax-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tax-deployer
